# Builds the plugin, runs the tests and uploads the plugin DLL.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build Driver DLL

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build
      run: dotnet build NINASonyCameraPlugin.sln --configuration Release --nologo

    - name: Test
      run: dotnet test NINASonyCameraPlugin.sln --configuration Release --no-build --nologo

    - name: Upload SonyCamera DLL
      uses: actions/upload-artifact@v4
      with:
        name: SonyCamera-DLL
        path: |
          **/bin/Release/**/NINA.RetroKiwi.Plugin.SonyCamera.dll
